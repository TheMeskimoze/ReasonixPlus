name: PR audit

# Audits every incoming pull request against the LATEST commit of the branch it
# targets, not the commit it branched from. The job checks out the merge commit
# GitHub builds from the pull request head and the current base tip, so a branch
# that no longer applies, or that only passes on its stale base, fails here
# instead of on the base branch after the merge.
#
# The audit only reports. There is no merge step, no merge call and no write
# permission anywhere in this file: a green run marks the pull request ready for a
# human to merge, and merging stays a manual act.
#
# A conflicted pull request has no merge commit. The job then stops before it
# installs anything and says so, rather than auditing the head alone and passing.
#
# `workflow_dispatch` re-runs the same audit against the dispatched ref, which is
# how a change to this file is proven before it gates anything.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One audit per pull request: a new push cancels the run it supersedes.
concurrency:
  group: pr-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PR audit
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # `github.sha` is the pull request merge commit only while GitHub holds one
      # for this pull request, and it can be older than the event snapshot once
      # the base has moved. Fetching the ref by name is what makes "the latest
      # commit" literal, and a missing ref the answer to a conflicted branch.
      - name: Merge the pull request into the latest base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! git fetch --no-tags --depth=2 origin "refs/pull/${PR}/merge:refs/pr-audit/merge"; then
            echo "::error title=Merge conflict::This pull request does not merge cleanly into ${BASE}. Rebase it on the latest ${BASE} and push again."
            exit 1
          fi
          git checkout --detach refs/pr-audit/merge

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # Installed the way the release pipeline installs them, so a green audit means
      # the same tree the release will build. The root postinstall would install the
      # desktop dependencies with scripts disabled, so it is skipped and the desktop
      # step below installs them with scripts, as release does.
      - name: Install root dependencies
        env:
          REASONIX_SKIP_DESKTOP_POSTINSTALL: "1"
        run: npm ci --os=win32 --cpu=x64

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --os=win32 --cpu=x64

      # Runs before the suite, so a branch that deletes or silently skips tests is
      # caught instead of showing up as a shorter green run.
      - name: Test suite may not shrink
        if: github.event_name == 'pull_request'
        env:
          PR_AUDIT_BASE: HEAD^1
        run: npm run audit:tests

      # One gate, defined once, in the repo: `npm run verify`. The workflow states
      # which commit is audited and leaves what "green" means to package.json.
      - name: Audit the merged commit
        run: npm run verify

      - name: Report
        if: always()
        shell: bash
        run: |
          short() { git rev-parse --short "$1" 2>/dev/null || echo unknown; }
          {
            echo "### PR audit"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | ${{ job.status }} |"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "| Pull request | #${{ github.event.pull_request.number }} into \`${{ github.event.pull_request.base.ref }}\` |"
              if git rev-parse --verify -q HEAD^2 >/dev/null; then
                echo "| Head commit | \`$(short HEAD^2)\` |"
                echo "| Base commit | \`$(short HEAD^1)\` |"
                echo "| Audited | \`$(short HEAD)\`, the merge of head into base |"
              else
                echo "| Audited | \`$(short HEAD)\`, not a merge: the head did not merge into the base |"
              fi
            else
              echo "| Ref | \`${{ github.ref_name }}\` |"
              echo "| Audited | \`$(short HEAD)\` |"
            fi
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Ready to merge. This audit never merges: merging stays manual."
            else
              echo "Not ready to merge. The failing step above names what to correct."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
